<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Starryboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-hover-border: rgba(88, 101, 242, 0.4);
            --primary: #5865F2;
            --primary-hover: #4752C4;
            --accent-green: #10B981;
            --accent-green-glow: rgba(16, 185, 129, 0.15);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                    radial-gradient(at 0% 0%, rgba(88, 101, 242, 0.12) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 顶部 Header */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .dashboard-title h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .dashboard-title p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* 用户个人信息小组件 */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .user-name {
            font-size: 14px;
            font-weight: 600;
        }

        .btn-logout {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            margin-left: 8px;
            transition: color 0.2s;
        }

        .btn-logout:hover {
            color: #ef4444;
        }

        /* 服务器网格布局 */
        .server-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        /* 服务器卡片组件 */
        .server-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .server-card:hover {
            transform: translateY(-4px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3), 0 0 20px rgba(88, 101, 242, 0.1);
        }

        /* 卡片头部 */
        .card-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .server-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .server-info {
            flex: 1;
            overflow: hidden;
        }

        .server-name {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #f8fafc;
        }

        .server-status-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .status-dot.installed { background-color: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }
        .status-dot.uninstalled { background-color: #f59e0b; }

        /* Bump 倒计时核心区域 */
        .bump-status-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bump-label {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bump-time {
            font-family: 'JetBrains Mono', monospace, monospace;
            font-size: 14px;
            font-weight: 600;
        }

        .bump-time.ready {
            color: var(--accent-green);
        }

        .bump-time.cooldown {
            color: #64748b;
        }

        /* 操作按钮组 */
        .card-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* 动画脉冲 */
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="dashboard-header">
        <div class="dashboard-title">
            <h1>Servers</h1>
            <p>Select a Discord server to configure or bump</p>
        </div>

        <!-- 动态渲染用户信息 -->
        <div class="user-profile" id="userProfile" style="display: none;">
            <img class="user-avatar" id="userAvatar" src="" alt="Avatar">
            <span class="user-name" id="userName">User</span>
            <button class="btn-logout" title="Logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
    </div>

    <!-- 服务器网格容器 -->
    <div class="server-grid" id="serverGrid">
        <p style="color: var(--text-muted);">Loading your servers...</p>
    </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
