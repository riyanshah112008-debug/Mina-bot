name: Mina Bot CI
on:
  push:
    branches: [main, 'rebuild/**', 'security/**']
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - run: npm install --ignore-scripts
      - name: Repeat syntax and unit checks five times
        run: |
          for run in 1 2 3 4 5; do
            echo "Verification pass $run/5"
            npm run check
            npm test
          done
