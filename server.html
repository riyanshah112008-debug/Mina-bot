<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Details - Starryboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header><a href="index.html">← Back to Home</a></header>

<main class="sb-main" style="max-width: 800px; margin: 40px auto; color: #fff;">
    <div id="serverDetailContainer">
        <p>Loading server details...</p>
    </div>
</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const guildId = urlParams.get('id');

        if (!guildId) {
            alert('Invalid Server ID!');
            window.location.href = 'index.html';
            return;
        }

        // 从后端/缓存中获取该服务器的详细信息
        // 真实生产环境：const res = await fetch(`/api/servers/${guildId}`);
        // 测试阶段模拟：从 localStorage 中查找对应的 guild 数据
        const savedGuilds = JSON.parse(localStorage.getItem('starryboard_guilds') || '[]');
        const guild = savedGuilds.find(g => g.id === guildId) || {
            name: "Sample Server",
            icon: null,
            description: "This is a detailed description of the server.",
            tags: ["COMMUNITY", "GAMING"]
        };

        const iconUrl = guild.icon
            ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png?size=128`
            : 'https://cdn.discordapp.com/embed/avatars/0.png';

        document.getElementById('serverDetailContainer').innerHTML = `
                <div style="background: #1a1d26; padding: 24px; border-radius: 12px; text-align: center;">
                    <img src="${iconUrl}" style="width: 96px; height: 96px; border-radius: 50%;">
                    <h2>${guild.name}</h2>
                    <div style="margin: 12px 0;">
                        ${(guild.tags || []).map(t => `<span class="sb-tag">${t}</span>`).join(' ')}
                    </div>
                    <p style="color: #aaa; margin: 20px 0;">${guild.description || 'No description set.'}</p>
                    <a href="https://discord.gg/" target="_blank" class="sb-btn-join" style="padding: 10px 24px; text-decoration: none; display: inline-block;">
                        <i class="fa-brands fa-discord"></i> Join Server
                    </a>
                </div>
            `;
    });
</script>
</body>
</html>
