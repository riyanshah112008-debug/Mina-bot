<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Server - Starryboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #1a1d26;
            --input-bg: #222633;
            --border-color: #2e3446;
            --accent-color: #5865F2;
            --accent-hover: #4752c4;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .edit-card {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .edit-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
        }

        .edit-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .btn-back:hover { color: #fff; }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        .form-label span.req {
            color: #ff4d4f;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
        }

        .hint-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Checkbox 组优化 */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: var(--input-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="edit-card">
    <div class="edit-header">
        <h2 class="edit-title"><i class="fa-solid fa-pen-to-square" style="color: var(--accent-color);"></i> Edit Server</h2>
        <a href="javascript:history.back()" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Cancel</a>
    </div>

    <form id="editServerForm">
        <!-- 1. 主语言选择 (覆盖全球主要语种) -->
        <div class="form-group">
            <label class="form-label" for="language">Main Language <span class="req">*</span></label>
            <select id="language" class="form-control" required>
                <option value="en">English (English)</option>
                <option value="zh">Chinese (中文)</option>
                <option value="es">Spanish (Español)</option>
                <option value="ja">Japanese (日本語)</option>
                <option value="ko">Korean (한국어)</option>
                <option value="de">German (Deutsch)</option>
                <option value="fr">French (Français)</option>
                <option value="pt">Portuguese (Português)</option>
                <option value="ru">Russian (Русский)</option>
                <option value="it">Italian (Italiano)</option>
                <option value="tr">Turkish (Türkçe)</option>
                <option value="vi">Vietnamese (Tiếng Việt)</option>
                <option value="th">Thai (ไทย)</option>
                <option value="id">Indonesian (Bahasa Indonesia)</option>
                <option value="ar">Arabic (العربية)</option>
                <option value="hi">Hindi (हिन्दी)</option>
                <option value="pl">Polish (Polski)</option>
                <option value="nl">Dutch (Nederlands)</option>
                <option value="sv">Swedish (Svenska)</option>
                <option value="other">Other / Multi-language</option>
            </select>
            <div class="hint-text">The primary language spoken in your server.</div>
        </div>

        <!-- 2. 标签 -->
        <div class="form-group">
            <label class="form-label" for="tags">Tags (Comma separated)</label>
            <input type="text" id="tags" class="form-control" placeholder="e.g. gaming, anime, chill, coding">
            <div class="hint-text">Categorize your server with up to 5 keywords separated by commas.</div>
        </div>

        <!-- 3. 服务器描述 -->
        <div class="form-group">
            <label class="form-label" for="description">Description <span class="req">*</span></label>
            <textarea id="description" class="form-control" placeholder="Write a detailed introduction for your server to attract new members..." required></textarea>
            <div class="hint-text">Supports markdown formatting & emojis.</div>
        </div>

        <!-- 4. 公开性与 NSFW 设置 (Disboard 核心配置项) -->
        <div class="form-group">
            <label class="form-label">Options</label>
            <div class="checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="isPublic" checked>
                    <span><i class="fa-solid fa-globe" style="color: #10b981;"></i> Public Server</span>
                </label>
                <div class="hint-text" style="margin-top: -6px; margin-left: 28px;">Display this server on the public home & search pages.</div>

                <label class="checkbox-label" style="margin-top: 8px;">
                    <input type="checkbox" id="isNsfw">
                    <span><i class="fa-solid fa-triangle-exclamation" style="color: #f59e0b;"></i> NSFW Server</span>
                </label>
                <div class="hint-text" style="margin-top: -6px; margin-left: 28px;">Check this if your server contains 18+ adult content.</div>
            </div>
        </div>

        <!-- 保存按钮 -->
        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-floppy-disk"></i> SAVE CHANGES
        </button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const guildId = urlParams.get('id');

        if (!guildId) {
            alert('Invalid Server ID!');
            window.location.href = './index.html';
            return;
        }

        // ================= 1. 回显已保存的数据 (如果有) =================
        const savedMeta = localStorage.getItem(`server_meta_${guildId}`);
        if (savedMeta) {
            try {
                const meta = JSON.parse(savedMeta);
                if (meta.language) document.getElementById('language').value = meta.language;
                if (meta.tags && Array.isArray(meta.tags)) document.getElementById('tags').value = meta.tags.join(', ');
                if (meta.description) document.getElementById('description').value = meta.description;
                if (meta.isPublic !== undefined) document.getElementById('isPublic').checked = meta.isPublic;
                if (meta.isNsfw !== undefined) document.getElementById('isNsfw').checked = meta.isNsfw;
            } catch (e) {
                console.error("加载旧数据失败:", e);
            }
        }

        // ================= 2. 表单提交保存逻辑 =================
        document.getElementById('editServerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // 解析标签，过滤空格并限制最多 5 个
            const rawTags = document.getElementById('tags').value;
            const tagsArray = rawTags.split(',')
                .map(t => t.trim().toLowerCase())
                .filter(t => t.length > 0)
                .slice(0, 5);

            const payload = {
                guildId: guildId,
                language: document.getElementById('language').value,
                tags: tagsArray,
                description: document.getElementById('description').value.trim(),
                isPublic: document.getElementById('isPublic').checked,
                isNsfw: document.getElementById('isNsfw').checked,
                updatedAt: Date.now()
            };

            // ⚠️ 测试阶段：写入 localStorage
            localStorage.setItem(`server_meta_${guildId}`, JSON.stringify(payload));

            // 🚀 生产环境：发往 Flask 后端
            /*
            try {
                const response = await fetch('http://localhost:5000/api/server/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('starryboard_token')}`
                    },
                    body: JSON.stringify(payload)
                });
                if(!response.ok) throw new Error("Save failed");
            } catch(err) {
                alert("保存失败，请重试");
                return;
            }
            */

            alert('Server settings saved successfully!');
            window.location.href = `./server.html?id=${guildId}`;
        });
    });
</script>
</body>
</html>
